name: quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  business-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install SQL quality dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run business-contract regression tests
        run: python -m unittest discover -s tests -v
      - name: Verify deterministic SkillHub bundle
        run: python tools/build_skillhub_bundle.py --check
      - name: Build and verify WorkBuddy ZIP
        run: |
          python tools/build_workbuddy_bundle.py
          python tools/build_workbuddy_bundle.py --check
